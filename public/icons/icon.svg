<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24211D" />
      <stop offset="100%" stop-color="#141311" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#EFE9DE" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Outer App Rounded Icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3" />

  <!-- Calendar Base Card -->
  <g filter="url(#shadow)">
    <rect x="96" y="104" width="320" height="304" rx="36" fill="url(#cardGrad)" />
    
    <!-- Calendar Header Bar -->
    <path d="M96 140 C96 120, 112 104, 132 104 L380 104 C400 104, 416 120, 416 140 L416 184 L96 184 Z" fill="url(#accentGrad)" />
    
    <!-- Calendar Rings -->
    <rect x="156" y="80" width="24" height="48" rx="12" fill="#FAF8F5" stroke="#92400E" stroke-width="4" />
    <rect x="332" y="80" width="24" height="48" rx="12" fill="#FAF8F5" stroke="#92400E" stroke-width="4" />

    <!-- Calendar Content - Stylized Day Off "OFF" & Maple Leaf -->
    <!-- Stylized Maple Leaf Symbol -->
    <path d="M256 220 L268 250 L292 242 L284 266 L308 274 L288 290 L296 304 L266 300 L262 334 L250 334 L246 300 L216 304 L224 290 L204 274 L228 266 L220 242 L244 250 Z" fill="#D97706" opacity="0.9" />

    <!-- "OFF" pill badge at bottom -->
    <rect x="180" y="342" width="152" height="38" rx="19" fill="#24211D" />
    <text x="256" y="367" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FAF8F5" text-anchor="middle" letter-spacing="3">DAY OFF</text>
  </g>
</svg>